name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "ci/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      # The existing repository has substantial Prettier-formatting debt.
      # Keep ESLint's code-quality rules blocking while formatting is cleaned up separately.
      - name: Lint
        run: bun run lint -- --rule 'prettier/prettier: off'

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Build production bundle
        run: bun run build
